apiVersion: v1
kind: ConfigMap
metadata:
  name: imaint-config
  namespace: imaint
data:
  CMMS_BASE_URL: "http://cmms:8001"
  # IP del gateway della rete docker "kind" dove gira il proxy socat verso Ollama
  # (docker network inspect kind -f '{{(index .IPAM.Config 0).Gateway}}'). Da adattare.
  OLLAMA_HOST: "http://172.18.0.1:11434"
  POSTGRES_USER: imaint
  POSTGRES_DB: imaint_agent
---
# Dev only: per non committare segreti reali usa kubectl create secret (vedi README)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: imaint
type: Opaque
stringData:
  POSTGRES_PASSWORD: imaint_dev_pw
  DATABASE_URL: postgresql+psycopg2://imaint:imaint_dev_pw@postgres:5432/imaint_agent

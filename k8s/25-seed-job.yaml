apiVersion: batch/v1
kind: Job
metadata:
  name: cmms-seed
  namespace: imaint
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
      containers:
        - name: seed
          image: imaint-cmms:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "cmms.seed"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: DATABASE_URL }

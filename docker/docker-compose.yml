services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: imaint
      POSTGRES_PASSWORD: imaint_dev_pw
      POSTGRES_DB: imaint_agent
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imaint -d imaint_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  cmms:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cmms
    ports:
      - "8111:8001"
    environment:
      DATABASE_URL: postgresql+psycopg2://imaint:imaint_dev_pw@postgres:5432/imaint_agent
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    network_mode: host
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8110"]
    env_file:
      - ../.env
    environment:
      CMMS_BASE_URL: http://localhost:8111
      OLLAMA_HOST: http://localhost:11434
    depends_on:
      - cmms
      
volumes:
  pgdata: